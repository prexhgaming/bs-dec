name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Offline unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite (no network needed)
        run: python -m unittest discover -s tests -v

      - name: Smoke test the CLI
        run: |
          python fetch_apk.py --help > /dev/null
          python fetch_apk.py --version

  resolve-smoke:
    name: Live resolve check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only when explicitly requested: this job touches the network.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve a known release without downloading it
        run: |
          python fetch_apk.py --package com.netease.newspike --version-code 169 --arch universal --mode probe
