name: Fetch APK from APKCombo

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name
        required: true
        default: com.netease.newspike
      slug:
        description: APKCombo slug
        required: false
        default: blood-strike-x-dj-snake
      variant:
        description: apk (universal) | xapk (bundle)
        required: true
        default: apk
      require_abi:
        description: Comma separated ABIs that must exist inside the file
        required: true
        default: arm64-v8a,armeabi-v7a
      extract_abi:
        description: ABI to extract from the archive
        required: false
        default: ""
      verify_page_sha256:
        description: Also check the file against the SHA-256 published on the APKCombo page
        required: true
        default: "false"
      expect_version:
        description: Fail unless the APKCombo page offers this version (empty = accept any)
        required: false
        default: ""
      apk_url:
        description: Direct archive URL; skips APKCombo scraping (use when the runner IP is blocked)
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show inputs
        run: |
          echo "package=${{ inputs.package }} slug=${{ inputs.slug }} variant=${{ inputs.variant }}"
          echo "abis=${{ inputs.require_abi }} expect_version=${{ inputs.expect_version || '<any>' }}"

      - name: Restore the cached archive
        id: cache
        uses: actions/cache@v4
        with:
          path: downloads
          key: apk-v2-${{ inputs.package }}-${{ inputs.variant }}-${{ inputs.expect_version || 'any' }}
          restore-keys: |
            apk-v2-${{ inputs.package }}-${{ inputs.variant }}-

      - name: Download the APK if the cache missed
        shell: bash
        env:
          PKG: ${{ inputs.package }}
          SLUG: ${{ inputs.slug }}
          VARIANT: ${{ inputs.variant }}
          ABIS: ${{ inputs.require_abi }}
          EXTRACT: ${{ inputs.extract_abi }}
          PAGE_SHA: ${{ inputs.verify_page_sha256 }}
          VERSION: ${{ inputs.expect_version }}
          APK_URL: ${{ inputs.apk_url }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -o pipefail
          if [ "$CACHE_HIT" = "true" ]; then
            echo "Cache hit - the APK was restored, no download needed."
            file=$(find downloads -maxdepth 1 -type f \( -name '*.apk' -o -name '*.xapk' \) | head -1)
            if [ -z "$file" ]; then echo "::error::Cache hit but no archive in downloads/"; exit 1; fi
            echo "Using cached archive: $file"
            args=( --apk-file "$file" )
          elif [ -n "$APK_URL" ]; then
            echo "Cache miss - downloading from direct URL."
            args=( --apk-url "$APK_URL" --mode download --out-dir downloads )
          else
            echo "Cache miss - downloading from APKCombo."
            args=( -p "$PKG" --slug "$SLUG" --variant "$VARIANT" --mode download --out-dir downloads )
            [ -n "$VERSION" ] && args+=( --expect-version "$VERSION" )
          fi
          args+=( --detect-abis --require-abi "$ABIS" )
          [ "$PAGE_SHA" = "true" ] && args+=( --use-page-sha256 )
          [ -n "$EXTRACT" ] && args+=( --extract-abi "$EXTRACT" )
          echo "\$ python fetch_apk.py ${args[*]}"
          set +e
          python fetch_apk.py "${args[@]}" 2>&1 | tee fetch.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 4 ]; then
            echo "::error::APKCombo blocked this runner's IP (Cloudflare). Re-run with apk_url."
          fi
          {
            echo "## fetch_apk.py said"
            echo ""
            echo '```'
            tail -n 45 fetch.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Verify the archive
        shell: bash
        env:
          ABIS: ${{ inputs.require_abi }}
        run: |
          set -euo pipefail
          file=$(find downloads -maxdepth 1 -type f \( -name '*.apk' -o -name '*.xapk' \) | head -1)
          if [ -z "$file" ]; then echo "::error::No archive in downloads/"; exit 1; fi
          ls -lh "$file"
          sha256sum "$file" | tee downloads/SHA256SUMS.txt
          python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); names=z.namelist(); abis=sorted({p.split('/')[1] for p in names if p.startswith('lib/') and len(p.split('/'))>2}); print('ABIs:', ', '.join(abis)); missing=[a for a in sys.argv[2].split(',') if a not in abis]; print('MISSING:', ', '.join(missing)) if missing else print('All required ABIs present'); sys.exit(1 if missing else 0)" "$file" "$ABIS"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: bloodstrike-apk
          path: downloads/
          retention-days: 7
