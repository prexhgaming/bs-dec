name: Decompile a native lib

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name
        required: true
        default: com.netease.newspike
      slug:
        description: APKCombo slug
        required: false
        default: blood-strike-x-dj-snake
      variant:
        description: apk (universal) | xapk (bundle)
        required: true
        default: apk
      abi:
        description: ABI whose library is decompiled
        required: true
        default: armeabi-v7a
      so_name:
        description: Library file name inside lib/<abi>/
        required: true
        default: libGame.so
      engine:
        description: capstone | ghidra | ida
        required: true
        default: capstone
      expect_version:
        description: Fail unless the page offers this version (empty = accept any)
        required: false
        default: ""
      apk_url:
        description: Direct archive URL; skips APKCombo scraping (use when the runner IP is blocked)
        required: false
        default: ""
      max_functions:
        description: Stop after N functions (0 = every candidate)
        required: false
        default: "0"
      max_instructions:
        description: Per-function instruction cap (0 = no cap)
        required: false
        default: "0"
      split_mb:
        description: Split decompilation parts every N MB of code (0 = one part)
        required: false
        default: "0"
      text_listing:
        description: Emit a plain text instruction listing alongside JSONL
        required: false
        default: "false"

permissions:
  contents: read

concurrency:
  group: decompile-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      PYTHONUNBUFFERED: "1"
      PACKAGE: ${{ inputs.package || 'com.netease.newspike' }}
      SLUG: ${{ inputs.slug || 'blood-strike-x-dj-snake' }}
      VARIANT: ${{ inputs.variant || 'apk' }}
      ABI: ${{ inputs.abi || 'armeabi-v7a' }}
      SO: ${{ inputs.so_name || 'libGame.so' }}
      ENGINE: ${{ inputs.engine || 'capstone' }}
      EXPECT_VERSION: ${{ inputs.expect_version || '' }}
      APK_URL: ${{ inputs.apk_url || '' }}
      MAX_FN: ${{ inputs.max_functions }}
      MAX_INSN: ${{ inputs.max_instructions }}
      SPLIT: ${{ inputs.split_mb }}
      TEXT: ${{ inputs.text_listing }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install capstone
        if: inputs.engine == 'capstone'
        run: python -m pip install --no-cache-dir "capstone>=5,<6"

      - name: Install Ghidra
        if: inputs.engine == 'ghidra'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-21-jdk-headless unzip > /dev/null
          url=$(curl -sSL https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
            | python -c "import json,sys; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if a['name'].endswith('.zip')][0])")
          echo "Ghidra release: $url"
          curl -sSL "$url" -o /tmp/ghidra.zip
          unzip -q /tmp/ghidra.zip -d /opt
          ghidra_dir=$(find /opt -maxdepth 1 -type d -name 'ghidra_*' | head -1)
          echo "GHIDRA_HOME=$ghidra_dir" >> "$GITHUB_ENV"
          ls "$ghidra_dir/support/analyzeHeadless"

      - name: Compile check
        run: python -m compileall -q apkcombo analysis fetch_apk.py

      - name: Restore the cached archive
        id: cache
        uses: actions/cache@v4
        with:
          path: downloads
          key: apk-v2-${{ inputs.package || 'com.netease.newspike' }}-${{ inputs.variant || 'apk' }}-${{ inputs.expect_version || 'any' }}
          restore-keys: |
            apk-v2-${{ inputs.package || 'com.netease.newspike' }}-${{ inputs.variant || 'apk' }}-

      - name: Download the APK if the cache missed
        shell: bash
        env:
          PKG: ${{ inputs.package || 'com.netease.newspike' }}
          SLUG: ${{ inputs.slug || 'blood-strike-x-dj-snake' }}
          VARIANT: ${{ inputs.variant || 'apk' }}
          ABI: ${{ inputs.abi || 'armeabi-v7a' }}
          SO: ${{ inputs.so_name || 'libGame.so' }}
          ENGINE: ${{ inputs.engine || 'capstone' }}
          EXPECT_VERSION: ${{ inputs.expect_version || '' }}
          APK_URL: ${{ inputs.apk_url || '' }}
          MAX_FN: ${{ inputs.max_functions }}
          MAX_INSN: ${{ inputs.max_instructions }}
          SPLIT: ${{ inputs.split_mb }}
          TEXT: ${{ inputs.text_listing }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -o pipefail
          if [ "$CACHE_HIT" = "true" ]; then
            echo "Cache hit - the APK was restored, no download needed."
            exit 0
          fi
          echo "Cache miss - downloading the APK."
          if [ -n "$APK_URL" ]; then
            args=( --apk-url "$APK_URL" --mode download --out-dir downloads )
          else
            args=( -p "$PKG" --slug "$SLUG" --variant "$VARIANT" --mode download --out-dir downloads )
            [ -n "$EXPECT_VERSION" ] && args+=( --expect-version "$EXPECT_VERSION" )
          fi
          args+=( --detect-abis --require-abi "$ABI" )
          echo "python fetch_apk.py ${args[*]}"
          set +e
          python fetch_apk.py "${args[@]}" 2>&1 | tee download.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            if [ "$STATUS" -eq 4 ]; then
              echo "::error::APKCombo blocked this runner's IP (Cloudflare). Re-run with apk_url."
            fi
            exit "$STATUS"
          fi

      - name: Locate the archive
        id: archive
        run: |
          FILE=$(find downloads -maxdepth 1 -type f \( -name '*.apk' -o -name '*.xapk' \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::no .apk/.xapk in downloads/"
            exit 1
          fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          ls -l "$FILE"
          sha256sum "$FILE" | tee downloads/SHA256SUMS.txt

      - name: Decompile with capstone
        if: inputs.engine == 'capstone'
        env:
          ABI: ${{ inputs.abi || 'armeabi-v7a' }}
          SO: ${{ inputs.so_name || 'libGame.so' }}
          MAX_FN: ${{ inputs.max_functions }}
          MAX_INSN: ${{ inputs.max_instructions }}
          SPLIT: ${{ inputs.split_mb }}
          TEXT: ${{ inputs.text_listing }}
        run: |
          set -o pipefail
          args=( "${{ steps.archive.outputs.path }}" --abi "$ABI" --member "lib/$ABI/$SO" --out decompiled
                 --max-functions "$MAX_FN" --max-instructions "$MAX_INSN" --split-mb "$SPLIT" )
          [ "$TEXT" = "true" ] && args+=( --text )
          python analysis/decompile_lib.py "${args[@]}" 2>&1 | tee decompile.log

      - name: Decompile with Ghidra
        if: inputs.engine == 'ghidra'
        env:
          ABI: ${{ inputs.abi || 'armeabi-v7a' }}
          SO: ${{ inputs.so_name || 'libGame.so' }}
          MAX_FN: ${{ inputs.max_functions }}
        run: |
          set -o pipefail
          mkdir -p /tmp/ghidra-lib /tmp/ghidra-out /tmp/ghidra-project
          member=$(python -c "import sys,zipfile; z=zipfile.ZipFile(sys.argv[1]); want='lib/%s/%s' % (sys.argv[2], sys.argv[3]); print(want if want in z.namelist() else [n for n in z.namelist() if n.startswith('lib/%s/' % sys.argv[2]) and n.endswith('/'+sys.argv[3])][0])" "${{ steps.archive.outputs.path }}" "$ABI" "$SO")
          echo "extracting $member"
          python -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extract(sys.argv[2], '/tmp/ghidra-lib')" "${{ steps.archive.outputs.path }}" "$member"
          # Ghidra 12 runs Python scripts through PyGhidra; older releases use Jython.
          python -m pip install --no-cache-dir --quiet pyghidra 2>/dev/null || true
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/ghidra-project bloodstrike \
            -import "/tmp/ghidra-lib/$member" \
            -scriptPath analysis/ghidra \
             -postScript DecompileAll.py /tmp/ghidra-out "${MAX_FN:-0}" 0 \
             -deleteProject -analysisTimeoutPerFile 0 2>&1 | tee decompile.log

      - name: Decompile with IDA Pro
        if: inputs.engine == 'ida'
        env:
          ABI: ${{ inputs.abi || 'armeabi-v7a' }}
          SO: ${{ inputs.so_name || 'libGame.so' }}
          MAX_FN: ${{ inputs.max_functions }}
        run: |
          mkdir -p /tmp/ida-out decompiled /tmp/ida-lib
          python -c "import sys,zipfile; a=zipfile.ZipFile(sys.argv[1]); a.extract('lib/%s/%s' % (sys.argv[2], sys.argv[3]), '/tmp/ida-lib')" \
            "${{ steps.archive.outputs.path }}" "${{ inputs.abi || 'armeabi-v7a' }}" "${{ inputs.so_name || 'libGame.so' }}"
          SO_PATH="/tmp/ida-lib/lib/${{ inputs.abi || 'armeabi-v7a' }}/${{ inputs.so_name || 'libGame.so' }}"
          idat64 -A -S"analysis/ida/decompile_all.py /tmp/ida-out ${{ inputs.max_functions }} 0" \
            "$SO_PATH" 2>&1 | tee decompile.log || \
          idat -A -S"analysis/ida/decompile_all.py /tmp/ida-out ${{ inputs.max_functions }} 0" \
            "$SO_PATH" 2>&1 | tee decompile.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Decompile"
            echo ""
            echo "Engine: \`${{ inputs.engine || 'capstone' }}\`"
            echo "ABI: \`${{ inputs.abi || 'armeabi-v7a' }}\`"
            echo "Library: \`${{ inputs.so_name || 'libGame.so' }}\`"
            echo ""
            echo "Outputs: \`decompiled/\`, \`decompile.log\`, \`reports/\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the decompilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-${{ inputs.abi }}-${{ inputs.engine }}
          path: |
            decompiled/
            decompile.log
            reports/
          if-no-files-found: warn
          retention-days: 30
