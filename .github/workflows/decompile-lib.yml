name: Decompile a native lib

# Downloads the whole archive, takes the chosen ABI's library out of it and turns
# the entire library into an uploadable listing:
#  * capstone (default) - every function disassembled into gzipped JSONL parts
#  * ghidra             - headless Ghidra + decompiler, produces C
#  * ida                - needs a self-hosted runner with a licensed IDA install
# Download the artifact, then explore it with analysis/inspect_decompiled.py.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package name
        required: true
        default: com.netease.newspike
      slug:
        description: APKCombo slug (the part before the package in the URL)
        required: false
        default: blood-strike-x-dj-snake
      variant:
        description: apk (universal) | xapk (bundle)
        required: true
        default: apk
      abi:
        description: ABI whose library is decompiled
        required: true
        default: armeabi-v7a
      so_name:
        description: Library file name inside lib/<abi>/
        required: false
        default: libGame.so
      engine:
        description: capstone (fast) | ghidra (real C, slow) | ida (self-hosted only)
        required: true
        default: capstone
      expect_version:
        description: Fail unless the page offers this version (empty = accept any)
        required: false
        default: ""
      max_functions:
        description: Stop after N functions (0 = every candidate)
        required: false
        default: "0"
      max_instructions:
        description: Per-function instruction cap
        required: false
        default: "20000"
      split_mb:
        description: Start a new JSONL part after this many uncompressed MiB
        required: false
        default: "48"
      text_listing:
        description: Also write a human-readable listing.txt (big)
        required: false
        default: "false"
      retention_days:
        description: Artifact retention
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show inputs
        env:
          PKG: ${{ inputs.package }}
          SLUG: ${{ inputs.slug }}
          VARIANT: ${{ inputs.variant }}
          ABI: ${{ inputs.abi }}
          SO: ${{ inputs.so_name }}
          ENGINE: ${{ inputs.engine }}
        run: |
          {
            echo "### Request"
            echo ""
            echo "| input | value |"
            echo "| --- | --- |"
            echo "| package | \`$PKG\` |"
            echo "| slug | \`$SLUG\` |"
            echo "| variant | \`$VARIANT\` |"
            echo "| ABI | \`$ABI\` |"
            echo "| library | \`$SO\` |"
            echo "| engine | \`$ENGINE\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          df -h / | tail -1

      - name: Install capstone
        if: inputs.engine == 'capstone'
        run: python -m pip install --no-cache-dir "capstone>=5,<6"

      - name: Install Ghidra
        if: inputs.engine == 'ghidra'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-21-jdk-headless unzip > /dev/null
          url=$(curl -sSL https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
            | python -c "import json,sys; d=json.load(sys.stdin); print([a['browser_download_url'] for a in d['assets'] if a['name'].endswith('.zip')][0])")
          echo "Ghidra release: $url"
          curl -sSL "$url" -o /tmp/ghidra.zip
          unzip -q /tmp/ghidra.zip -d /opt
          ghidra_dir=$(find /opt -maxdepth 1 -type d -name 'ghidra_*' | head -1)
          echo "GHIDRA_HOME=$ghidra_dir" >> "$GITHUB_ENV"
          ls "$ghidra_dir/support/analyzeHeadless"

      - name: Compile check
        run: python -m compileall -q apkcombo analysis fetch_apk.py

      - name: Download the full archive
        env:
          PKG: ${{ inputs.package }}
          SLUG: ${{ inputs.slug }}
          VARIANT: ${{ inputs.variant }}
          VERSION: ${{ inputs.expect_version }}
        run: |
          set -o pipefail
          args=( -p "$PKG" --variant "$VARIANT" --mode download --out-dir downloads --detect-abis )
          [ -n "$SLUG" ] && args+=( --slug "$SLUG" )
          [ -n "$VERSION" ] && args+=( --expect-version "$VERSION" )
          python fetch_apk.py "${args[@]}"

      - name: Locate the archive
        id: archive
        run: |
          file=$(find downloads -maxdepth 1 -name '*.apk' -o -maxdepth 1 -name '*.xapk' | head -1)
          if [ -z "$file" ]; then echo "no archive in downloads/"; exit 1; fi
          echo "path=$file" >> "$GITHUB_OUTPUT"
          sha256sum "$file" | tee downloads/SHA256SUMS.txt

      - name: Decompile with capstone
        if: inputs.engine == 'capstone'
        env:
          ABI: ${{ inputs.abi }}
          MAX_FN: ${{ inputs.max_functions }}
          MAX_INSN: ${{ inputs.max_instructions }}
          SPLIT: ${{ inputs.split_mb }}
          TEXT: ${{ inputs.text_listing }}
        run: |
          set -o pipefail
          args=( "${{ steps.archive.outputs.path }}" --abi "$ABI" --out decompiled
                 --max-functions "$MAX_FN" --max-instructions "$MAX_INSN" --split-mb "$SPLIT" )
          [ "$TEXT" = "true" ] && args+=( --text )
          python analysis/decompile_lib.py "${args[@]}" 2>&1 | tee decompile.log

      - name: Decompile with Ghidra
        if: inputs.engine == 'ghidra'
        env:
          ABI: ${{ inputs.abi }}
          MAX_FN: ${{ inputs.max_functions }}
        run: |
          set -o pipefail
          mkdir -p /tmp/ghidra-lib /tmp/ghidra-out
          member=$(python -c "import zipfile,sys; z=zipfile.ZipFile(sys.argv[1]); print([n for n in z.namelist() if n.startswith('lib/' + sys.argv[2] + '/')][0])" "${{ steps.archive.outputs.path }}" "$ABI")
          echo "extracting $member"
          python -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extract(sys.argv[2], '/tmp/ghidra-lib')" "${{ steps.archive.outputs.path }}" "$member"
          "$GHIDRA_HOME/support/analyzeHeadless" /tmp/ghidra-project bloodstrike \
            -import "/tmp/ghidra-lib/$member" \
            -scriptPath analysis/ghidra \
            -postScript DecompileAll.py /tmp/ghidra-out "${MAX_FN:-0}" 14400 \
            -deleteProject -analysisTimeoutPerFile 10800 2>&1 | tee decompile.log
          mkdir -p decompiled
          gzip -9 -c /tmp/ghidra-out/decompiled.c > decompiled/decompiled.c.gz
          cp /tmp/ghidra-out/ghidra-manifest.json decompiled/
          ls -l decompiled

      - name: Decompile with IDA Pro
        if: inputs.engine == 'ida'
        run: |
          if ! command -v idat64 >/dev/null && ! command -v idat >/dev/null; then
            echo "IDA is not on PATH. This engine needs a self-hosted runner with a"
            echo "licensed IDA install (Hex-Rays ARM/ARM64). Use engine=capstone or"
            echo "engine=ghidra on hosted runners."
            exit 1
          fi
          mkdir -p /tmp/ida-out decompiled
          idat64 -A -S"analysis/ida/decompile_all.py /tmp/ida-out ${{ inputs.max_functions }} 14400" \
            "lib/${{ inputs.abi }}/${{ inputs.so_name }}" 2>&1 | tee decompile.log || \
          idat -A -S"analysis/ida/decompile_all.py /tmp/ida-out ${{ inputs.max_functions }} 14400" \
            "lib/${{ inputs.abi }}/${{ inputs.so_name }}" 2>&1 | tee decompile.log
          gzip -9 -c /tmp/ida-out/decompiled.c > decompiled/decompiled.c.gz
          cp /tmp/ida-out/ida-manifest.json decompiled/

      - name: Summary
        if: always()
        run: |
          {
            echo "## Decompilation"
            echo ""
            if [ -f decompiled/manifest.json ]; then
              python -c "import json;m=json.load(open('decompiled/manifest.json'));r=m['result'];print(f\"- engine: capstone {m['capstone']}\");print(f\"- input: \\\`{m['input']['label']}\\\` sha256 \\\`{m['input']['sha256']}\\\`\");print(f\"- functions: {r['functions_written']} / {r['function_candidates']} candidates\");print(f\"- instructions: {r['instructions']}\");print(f\"- output: {r['compressed_bytes']/(1<<20):.1f} MiB compressed in {len(r['parts'])} part(s)\");print(f\"- truncated functions: {r['truncated_functions']}\")"
            fi
            if [ -f decompiled/ghidra-manifest.json ]; then
              python -c "import json;m=json.load(open('decompiled/ghidra-manifest.json'));print(f\"- engine: ghidra, {m['functions_written']}/{m['functions_in_program']} functions\");print(f\"- decompiled.c: {m['output_bytes']/(1<<20):.1f} MiB in {m['seconds']}s\")"
            fi
            if [ -f decompiled/ida-manifest.json ]; then
              python -c "import json;m=json.load(open('decompiled/ida-manifest.json'));print(f\"- engine: ida, {m['functions_written']}/{m['functions_in_program']} functions\")"
            fi
            echo ""
            echo '```'
            tail -n 12 decompile.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the decompilation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-${{ inputs.abi }}-${{ inputs.engine }}
          path: |
            decompiled/
            decompile.log
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}
