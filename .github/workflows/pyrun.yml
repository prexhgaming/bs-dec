
name: PyRun Offset Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "pyrun_locator.py"
      - "libgame.so"
      - ".github/workflows/pyrun.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyelftools capstone

      
      - name: Analyze library
        run: |
          python pyrun_locator.py libgame.so \
            --window 45 \
            --max-candidates 50 \
            --entropy \
            --json report.json

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyrun-analysis
          path: report.json
          if-no-files-found: ignore
          retention-days: 7
