name: PyRun Offset Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "pyrun_locator.py"
      - "libgame.so"
      - "libGame.so"
      - ".github/workflows/pyrun.yml"

# Prevent a second push from cancelling the in-flight run, but never let two run
# at the same time (which is what produced "The operation was canceled").
concurrency:
  group: pyrun-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # fail fast instead of hanging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyelftools capstone

      - name: Locate target library
        id: locate
        run: |
          set -e
          ls -la
          if [ -f libgame.so ]; then echo "path=libgame.so" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f libGame.so ]; then echo "path=libGame.so" >> "$GITHUB_OUTPUT"; exit 0; fi
          F=$(find . -maxdepth 3 -type f -iname 'libgame.so' -not -path './.git/*' | head -n1 || true)
          [ -n "$F" ] || { echo "::error::libgame.so not found in workspace"; exit 1; }
          echo "path=${F#./}" >> "$GITHUB_OUTPUT"

      - name: Analyze library
        timeout-minutes: 15
        run: |
          python pyrun_locator.py "${{ steps.locate.outputs.path }}" \
            --window 45 \
            --max-candidates 50 \
            --entropy \
            --json report.json

      - name: Upload analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyrun-analysis
          path: report.json
          if-no-files-found: ignore
          retention-days: 7