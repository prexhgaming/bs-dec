name: Scan native libs for pyrun entry points

# Downloads the whole APK in the runner (no ranged payload reads, so a partial
# transfer can never fake a scan result), reads lib/<abi>/libGame.so out of the
# archive with zipfile (CRC-checked), and scans every requested ABI with
# analysis/scan_pyrun.py. Optionally matches functions against a local library
# fetched from a URL, which is how a build from a device can be compared with
# the one the mirror ships.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Application id
        required: true
        default: com.netease.newspike
      slug:
        description: APKCombo slug
        required: true
        default: blood-strike-x-dj-snake
      variant:
        description: apk, xapk or auto
        required: true
        default: apk
      abis:
        description: Comma separated ABIs to scan
        required: true
        default: armeabi-v7a,arm64-v8a
      so_name:
        description: Native library to inspect
        required: true
        default: libGame.so
      require_abi:
        description: Fail unless these ABIs exist in the archive (empty to skip)
        required: false
        default: arm64-v8a,armeabi-v7a
      expect_version:
        description: Fail unless the page offers this version (empty to skip)
        required: false
        default: ""
      match_url:
        description: Optional URL of a local .so to match functions against (empty to skip)
        required: false
        default: ""
      apk_url:
        description: Direct archive URL; skips APKCombo scraping (use when the runner's IP is blocked)
        required: false
        default: ""
      use_cache:
        description: Restore the archive from an earlier run instead of downloading it again
        required: false
        default: "true"
  push:
    branches: [main]
    paths:
      - analysis/**
      - apkcombo/**
      - fetch_apk.py
      - .github/workflows/scan-libs.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: "1"
      PACKAGE: ${{ inputs.package || 'com.netease.newspike' }}
      SLUG: ${{ inputs.slug || 'blood-strike-x-dj-snake' }}
      VARIANT: ${{ inputs.variant || 'apk' }}
      ABIS: ${{ inputs.abis || 'armeabi-v7a,arm64-v8a' }}
      SO_NAME: ${{ inputs.so_name || 'libGame.so' }}
      REQUIRE_ABI: ${{ inputs.require_abi || '' }}
      EXPECT_VERSION: ${{ inputs.expect_version || '' }}
      MATCH_URL: ${{ inputs.match_url || '' }}
      APK_URL: ${{ inputs.apk_url || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install capstone
        run: |
          python -m pip install --upgrade pip
          python -m pip install "capstone>=5"
          python -c "import capstone; print('capstone', capstone.__version__)"

      - name: Show inputs
        run: |
          echo "package=$PACKAGE slug=$SLUG variant=$VARIANT abis=$ABIS so=$SO_NAME"
          echo "require_abi=${REQUIRE_ABI:-<none>} expect_version=${EXPECT_VERSION:-<any>}"
          echo "match_url=${MATCH_URL:-<none>}"

      - name: Compile check
        run: python -m compileall -q apkcombo analysis fetch_apk.py

      - name: Restore the cached archive
        if: inputs.use_cache != 'false'
        uses: actions/cache@v4
        with:
          path: downloads
          key: apk-${{ inputs.package || 'com.netease.newspike' }}-${{ inputs.variant || 'apk' }}-${{ inputs.expect_version || 'any' }}-v1
          restore-keys: |
            apk-${{ inputs.package || 'com.netease.newspike' }}-${{ inputs.variant || 'apk' }}-

      - name: Resolve the archive
        run: |
          set -o pipefail
          EXISTING=$(find downloads -maxdepth 1 -type f \( -name '*.apk' -o -name '*.xapk' \) 2>/dev/null | head -n 1)
          ARGS=()
          if [ -n "$EXISTING" ]; then
            echo "reusing the cached archive: $EXISTING (APKCombo is not contacted)"
            ARGS=(--apk-file "$EXISTING")
          elif [ -n "$APK_URL" ]; then
            echo "downloading from a direct URL: $APK_URL"
            ARGS=(--apk-url "$APK_URL" --mode download --out-dir downloads)
          else
            ARGS=(-p "$PACKAGE" --slug "$SLUG" --variant "$VARIANT" --mode download --out-dir downloads)
            if [ -n "$EXPECT_VERSION" ]; then
              ARGS+=(--expect-version "$EXPECT_VERSION")
            fi
          fi
          if [ -n "$REQUIRE_ABI" ]; then
            ARGS+=(--detect-abis --require-abi "$REQUIRE_ABI")
          fi
          echo "python fetch_apk.py ${ARGS[*]}"
          set +e
          python fetch_apk.py "${ARGS[@]}" 2>&1 | tee download.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            if [ "$STATUS" -eq 4 ]; then
              echo "::error::APKCombo blocked this runner's IP (Cloudflare). Re-run with"
              echo "::error::apk_url set to a direct archive link, or keep a cache entry."
            fi
            exit "$STATUS"
          fi

      - name: Locate the archive
        id: archive
        run: |
          FILE=$(find downloads -maxdepth 1 -type f \( -name '*.apk' -o -name '*.xapk' \) | head -n 1)
          if [ -z "$FILE" ]; then
            echo "::error::no .apk/.xapk in downloads/"
            ls -la downloads || true
            exit 1
          fi
          echo "archive=$FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          ls -l "$FILE"
          sha256sum "$FILE" | tee downloads/SHA256SUMS.txt

      - name: Fetch the local library for matching
        if: inputs.match_url != ''
        run: |
          mkdir -p local
          curl -fL --retry 3 --retry-delay 2 -o "local/local-lib.so" "$MATCH_URL"
          ls -l local/local-lib.so
          python analysis/scan_pyrun.py local/local-lib.so --quiet 2>&1 | tee local/info.txt

      - name: Scan each ABI
        run: |
          set -o pipefail
          mkdir -p reports
          STATUS=0
          IFS=',' read -ra LIST <<< "$ABIS"
          for ABI in "${LIST[@]}"; do
            ABI="$(echo "$ABI" | xargs)"
            [ -z "$ABI" ] && continue
            ARGS=("${{ steps.archive.outputs.path }}" --abi "$ABI" --so-name "$SO_NAME"
                  --json "reports/pyrun-${ABI}.json"
                  --dump-functions "reports/functions-${ABI}.txt")
            if [ -f local/local-lib.so ]; then
              ARGS+=(--match-lib local/local-lib.so --match-abi "$ABI" --match-limit 100)
            fi
            echo "::group::scan $ABI"
            python analysis/scan_pyrun.py "${ARGS[@]}" 2>&1 | tee "reports/pyrun-${ABI}.txt" || STATUS=$?
            echo "::endgroup::"
          done
          {
            echo "## pyrun scan"
            echo ""
            echo "Archive: \`${{ steps.archive.outputs.path }}\`"
            echo ""
            for FILE in reports/pyrun-*.txt; do
              [ -e "$FILE" ] || continue
              echo "### $(basename "$FILE" .txt)"
              echo '```'
              cat "$FILE"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyrun-scan
          path: |
            reports/
            local/
            download.log
            downloads/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14
